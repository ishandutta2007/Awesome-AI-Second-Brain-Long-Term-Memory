<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#140a24" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatNode1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-8px, -14px); }
    }
    @keyframes floatNode2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(12px, 10px); }
    }
    @keyframes pulsePill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -80; }
    }
    .dynamic-bg-glow1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 250px 120px;
    }
    .dynamic-bg-glow2 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 950px 180px;
    }
    .dynamic-node1 {
      animation: floatNode1 7s ease-in-out infinite;
    }
    .dynamic-node2 {
      animation: floatNode2 8s ease-in-out infinite;
    }
    .dynamic-pill1 {
      animation: pulsePill 5s ease-in-out infinite;
    }
    .dynamic-pill2 {
      animation: pulsePill 6s ease-in-out infinite 1s;
    }
    .dynamic-pill3 {
      animation: pulsePill 5.5s ease-in-out infinite 2s;
    }
    .dynamic-pill4 {
      animation: pulsePill 6.5s ease-in-out infinite 0.5s;
    }
    .pulse-line {
      stroke-dasharray: 6, 6;
      animation: dashTravel 4s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows (Behind Everything) -->
  <circle class="dynamic-bg-glow1" cx="240" cy="120" r="260" fill="url(#glow-cyan)" />
  <circle class="dynamic-bg-glow2" cx="960" cy="180" r="280" fill="url(#glow-purple)" />

  <!-- Subtle Neural Network / Knowledge Graph Lines in Background -->
  <g opacity="0.25">
    <line x1="80" y1="90" x2="220" y2="160" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="220" y1="160" x2="310" y2="80" stroke="#818cf8" stroke-width="1.5" />
    <line x1="920" y1="100" x2="1050" y2="160" stroke="#c084fc" stroke-width="1.5" />
    <line x1="1050" y1="160" x2="1140" y2="90" stroke="#f472b6" stroke-width="1.5" />
    <line x1="1050" y1="160" x2="980" y2="280" stroke="#a855f7" stroke-width="1.5" />
    <line class="pulse-line" x1="180" y1="340" x2="360" y2="340" stroke="#38bdf8" stroke-width="2" />
    <line class="pulse-line" x1="840" y1="340" x2="1020" y2="340" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Floating Ambient Nodes (Behind Text Area) -->
  <g class="dynamic-node1" opacity="0.6">
    <circle cx="90" cy="95" r="7" fill="#38bdf8" />
    <circle cx="90" cy="95" r="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="310" cy="80" r="5" fill="#818cf8" />
    <circle cx="980" cy="280" r="6" fill="#ec4899" />
  </g>
  <g class="dynamic-node2" opacity="0.6">
    <circle cx="220" cy="160" r="6" fill="#06b6d4" />
    <circle cx="1140" cy="90" r="7" fill="#f472b6" />
    <circle cx="1140" cy="90" r="15" fill="none" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- Modern Grid Subtle Dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="600" cy="40" r="1.5" />
    <circle cx="560" cy="40" r="1.5" />
    <circle cx="640" cy="40" r="1.5" />
    <circle cx="600" cy="70" r="1.5" />
    <circle cx="560" cy="70" r="1.5" />
    <circle cx="640" cy="70" r="1.5" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g filter="url(#shadow)">
    <!-- Main Brain & AI Monogram / Icon Symbol -->
    <g transform="translate(600, 75)">
      <!-- Outer Hexagon Icon Frame -->
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="#1e1b4b" stroke="url(#title-grad)" stroke-width="2.5" />
      <text x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">🧠</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" 
          font-size="38" 
          font-weight="800" 
          letter-spacing="-0.5" 
          text-anchor="middle" 
          fill="url(#title-grad)">
      Awesome AI Second Brain &amp; Long-Term Memory
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="205" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" 
          font-size="16" 
          font-weight="400" 
          letter-spacing="0.2" 
          text-anchor="middle" 
          fill="#94a3b8">
      Curated Ecosystem of SaaS Platforms, Local-First Knowledge Graphs &amp; Persistent Agent Memory
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="235" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="1" 
          text-anchor="middle" 
          fill="#64748b">
      PKM • HYBRID RAG • MODEL CONTEXT PROTOCOL (MCP) • BIPARTITE VECTOR KNOWLEDGE
    </text>
  </g>

  <!-- Dynamic Interactive Feature Pills (In Foreground Bottom Row, Safe Below Text) -->
  <g transform="translate(600, 310)" text-anchor="middle" filter="url(#pill-shadow)">
    <!-- Pill 1: Local-First PKM -->
    <g class="dynamic-pill1" transform="translate(-375, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-85" cy="0" r="4" fill="#38bdf8" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">Local-First PKM</text>
    </g>

    <!-- Pill 2: Agent Memory & MCP -->
    <g class="dynamic-pill2" transform="translate(-125, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-95" cy="0" r="4" fill="#818cf8" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ede9fe">Agent Memory &amp; MCP</text>
    </g>

    <!-- Pill 3: Bi-Directional Graphs -->
    <g class="dynamic-pill3" transform="translate(135, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#111827" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-95" cy="0" r="4" fill="#c084fc" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fae8ff">Bi-Directional Graphs</text>
    </g>

    <!-- Pill 4: Private Offline RAG -->
    <g class="dynamic-pill4" transform="translate(385, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="#111827" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-85" cy="0" r="4" fill="#f472b6" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fce7f3">Private Offline RAG</text>
    </g>
  </g>

  <!-- Border Highlight Framing -->
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="url(#title-grad)" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
