:translate(0,0)}50%{transform:translate(-8px,-14px)}}@keyframes floatNode2{0%{transform:translate(0,0)}50%{transform:translate(12px,10px)}}@keyframes pulsePill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.dynamic-bg-glow1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:250px 120px}.dynamic-bg-glow2{animation:pulseGlow 8s ease-in-out infinite;transform-origin:950px 180px}.dynamic-node1{animation:floatNode1 7s ease-in-out infinite}.dynamic-node2{animation:floatNode2 8s ease-in-out infinite}.dynamic-pill1{animation:pulsePill 5s ease-in-out infinite}.dynamic-pill2{animation:pulsePill 6s ease-in-out infinite 1s}.dynamic-pill3{animation:pulsePill 5.5s ease-in-out infinite 2s}.dynamic-pill4{animation:pulsePill 6.5s ease-in-out infinite .5s}.pulse-line{stroke-dasharray:6,6;animation:dashTravel 4s linear infinite}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="18"/><circle cx="240" cy="120" r="260" fill="url(#glow-cyan)" class="dynamic-bg-glow1"/><circle cx="960" cy="180" r="280" fill="url(#glow-purple)" class="dynamic-bg-glow2"/><g opacity=".25"><line x1="80" x2="220" y1="90" y2="160" stroke="#38bdf8" stroke-width="1.5"/><line x1="220" x2="310" y1="160" y2="80" stroke="#818cf8" stroke-width="1.5"/><line x1="920" x2="1050" y1="100" y2="160" stroke="#c084fc" stroke-width="1.5"/><line x1="1050" x2="1140" y1="160" y2="90" stroke="#f472b6" stroke-width="1.5"/><line x1="1050" x2="980" y1="160" y2="280" stroke="#a855f7" stroke-width="1.5"/><line x1="180" x2="360" y1="340" y2="340" stroke="#38bdf8" stroke-width="2" class="pulse-line"/><line x1="840" x2="1020" y1="340" y2="340" stroke="#c084fc" stroke-width="2" class="pulse-line"/></g><g class="dynamic-node1" opacity=".6"><circle cx="90" cy="95" r="7" fill="#38bdf8"/><circle cx="90" cy="95" r="14" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1"/><circle cx="310" cy="80" r="5" fill="#818cf8"/><circle cx="980" cy="280" r="6" fill="#ec4899"/></g><g class="dynamic-node2" opa